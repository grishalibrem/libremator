name: Build Patched APK

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: ./gradlew assembleApkstoreRelease --no-daemon

      - name: Rename APK
        run: |
          mv presentation/build/outputs/apk/apkstore/release/presentation-apkstore-release.apk \
             Libremator-${{ github.run_number }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Libremator Patched Build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: Libremator-${{ github.run_number }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
